<!DOCTYPE html>
<html lang="en">

<head>

     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title>Basic Calculator</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

     <style>
          .bg-dark-blue {
               background-color: #061A40;
          }

          .bg-arial {
               background-color: #B9D6F2;
          }

          #output {
               color: green;
               font-weight: 500;
          }
     </style>

</head>

<body>

     <h2 class="bg-arial text-white p-2">Basic Calculator</h2>

     <div class="container-fluid bg-dark-blue p-3">

          <div class="container bg-arial p-2" style="border-radius:10px">

               <input id="display" type="text" class="container-fluid p-2" style="background:transparent;border:none">

               <p id="output"></p>

          </div>

          <div class="row m-2">
               <button class="col btn btn-primary num">7</button>
               <button class="col btn btn-primary num">8</button>
               <button class="col btn btn-primary num">9</button>
          </div>

          <div class="row m-2">
               <button class="col btn btn-primary num">4</button>
               <button class="col btn btn-primary num">5</button>
               <button class="col btn btn-primary num">6</button>
          </div>

          <div class="row m-2">
               <button class="col btn btn-primary num">1</button>
               <button class="col btn btn-primary num">2</button>
               <button class="col btn btn-primary num">3</button>
          </div>

          <div class="row m-2">
               <button class="col btn btn-secondary op">-</button>
               <button class="col btn btn-secondary op">+</button>
               <button class="col btn btn-secondary op">*</button>
          </div>

          <div class="row m-2">
               <button class="col btn btn-secondary op">/</button>
               <button class="col btn btn-success" id="enter">Enter</button>
               <button class="col btn btn-warning" id="clear">Clear</button>
          </div>

     </div>

     <script>

          let display = document.getElementById("display");
          let output = document.getElementById("output");

          let expression = "";

          /* number buttons */

          document.querySelectorAll(".num").forEach(btn => {

               btn.addEventListener("click", () => {

                    expression += btn.innerText;
                    display.value = expression;

               });

          });

          /* operator buttons */

          document.querySelectorAll(".op").forEach(btn => {

               btn.addEventListener("click", () => {

                    expression += btn.innerText;
                    display.value = expression;

               });

          });

          /* enter */

          document.getElementById("enter").addEventListener("click", () => {

               try {

                    let result = Function("return " + expression)();

                    output.innerText = "Output: " + result;

                    expression = result.toString();

                    display.value = expression;

               }

               catch {

                    output.innerText = "Error: Invalid expression";

                    expression = "";
                    display.value = "";

               }

          });

          /* clear */

          document.getElementById("clear").addEventListener("click", () => {

               expression = "";
               display.value = "";
               output.innerText = "";

          });

     </script>

</body>

<footer>

     <p class="bg-black text-white p-4 text-center">(c) Copyrights Claimed</p>

</footer>

</html>
